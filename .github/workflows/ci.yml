name: Release Ren'Py 7.6.1 engine
on:
  push:
    branches: ['7.6.1']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:20221113
    steps:
      - uses: actions/checkout@v4
      - name: Validate version branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 7.6.1
          source targets/7.6.1/target.env
          test "$RENPY_VERSION" = "$GITHUB_REF_NAME"
          test "$STATUS" = buildable
      - name: Install Switch 2 devkit
        run: curl -fsSL https://github.com/ouncebrew/ounce-devkit/releases/download/devkit-20261114/ounce-devkit-20261114.tar.xz | tar -xJ -C /opt/devkitpro
      - name: Build engine
        shell: bash
        run: |
          set -euo pipefail
          bash setup.bash
          bash build.bash
          bash build-switch2-runtime.bash
          bash build-engine.bash 7.6.1
          cd dist/7.6.1
          sha256sum *.nro > renounce-renpy-7.6.1.nro.sha256
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: renpy-7.6.1-switch2
          name: Ren'Py 7.6.1 for Switch 2
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/7.6.1/*
          fail_on_unmatched_files: true
