name: Build Ren'Py engines
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    strategy:
      fail-fast: false
      matrix:
        renpy: ['7.6.1']
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:20221113
    steps:
      - uses: actions/checkout@v4
      - name: Check target support
        run: |
          . "targets/${{ matrix.renpy }}/target.env"
          if [ "$STATUS" != buildable ]; then
            echo "Ren'Py $RENPY_VERSION requires a Python $PYTHON_MAJOR port; refusing to publish a mismatched engine" >&2
            exit 1
          fi
      - name: Install Switch 2 devkit
        run: curl -fsSL https://github.com/ouncebrew/ounce-devkit/releases/download/devkit-20261114/ounce-devkit-20261114.tar.xz | tar -xJ -C /opt/devkitpro
      - name: Prepare dependencies
        run: bash setup.bash
      - name: Build engine libraries
        run: bash build.bash && bash build-switch2-runtime.bash
      - name: Build engine-only NRO
        run: bash build-engine.bash '${{ matrix.renpy }}'
      - uses: actions/upload-artifact@v4
        with:
          name: renpy-${{ matrix.renpy }}
          path: dist/${{ matrix.renpy }}/*.nro
          if-no-files-found: error
