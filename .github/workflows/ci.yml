name: Release Ren'Py engine
on:
  push:
    branches:
      - '8.4.1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:20221113
    steps:
      - uses: actions/checkout@v4
      - name: Validate version branch and target
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          case "$version" in 8.4.1) ;; *) exit 1 ;; esac
          source "targets/$version/target.env"
          test "$RENPY_VERSION" = "$version"
          if test "$STATUS" != buildable; then
            echo "Ren'Py $version is not ready for a release ($STATUS)" >&2
            exit 1
          fi
      - name: Install Switch 2 devkit
        run: curl -fsSL https://github.com/ouncebrew/ounce-devkit/releases/download/devkit-20261114/ounce-devkit-20261114.tar.xz | tar -xJ -C /opt/devkitpro
      - name: Build Ren'Py 8.4.1
        if: github.ref_name == '8.4.1'
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y python3-venv cython3
          python3 -m venv --system-site-packages build-renpy8/venv
          RENONCE_HOST_PYTHON="$PWD/build-renpy8/venv/bin/python" bash build-renpy84-ci.bash
          mkdir -p dist/8.4.1
          cp build-renpy8/8.4.1/renounce-renpy-8.4.1.nro* dist/8.4.1/
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: renpy-${{ github.ref_name }}-switch2
          name: Ren'Py ${{ github.ref_name }} for Switch 2
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/${{ github.ref_name }}/*
          fail_on_unmatched_files: true
